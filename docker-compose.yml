services:
  bot:
    build:
      context: .
      # slim: no CLI tools (tool commands hidden) | full: Sherlock, Nuclei, GHunt, ...
      target: ${BOT_TARGET:-slim}
    restart: unless-stopped
    env_file:
      - .env
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /app/temp:size=100M,uid=999,gid=999
      # /app/reports holds durable command exports; under read_only it needs a
      # writable mount or every archive silently no-ops. tmpfs makes it work
      # (ephemeral); mount a named volume here instead to persist across restarts.
      - /app/reports:size=100M,uid=999,gid=999
      - /tmp:size=50M
    volumes:
      # $HOME: GHunt login and tool configs (full image); survives restarts
      - bot-home:/home/botuser
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 50
    healthcheck:
      test: ["CMD", "bun", "run", "scripts/healthcheck.js"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  bot-home:
