services:
  bot:
    build:
      context: .
      # slim: no CLI tools (tool commands hidden) | full: Sherlock, Nuclei, GHunt, ...
      target: ${BOT_TARGET:-slim}
    restart: unless-stopped
    env_file:
      - .env
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /app/temp:size=100M,uid=999,gid=999,mode=0700
      # Command exports (personal data about targets): ephemeral by design,
      # wiped on restart. Mount a named volume here instead to keep them.
      - /app/reports:size=100M,uid=999,gid=999,mode=0700
      - /tmp:size=50M
    volumes:
      # $HOME: GHunt login and tool configs (full image); survives restarts
      - bot-home:/home/botuser
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 50

volumes:
  bot-home:
