name: Update DOI and Citation

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-citation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # A release event checks out the tag (detached HEAD); check out the
          # default branch instead so the citation commit has a branch to push to.
          ref: ${{ github.event.repository.default_branch }}

      - name: Wait for Zenodo processing
        run: sleep 300

      - name: Update CITATION.cff
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          sed -i "s/^version:.*/version: $TAG_NAME/" CITATION.cff
          sed -i "s/^date-released:.*/date-released: $(date +%Y-%m-%d)/" CITATION.cff

      - name: Commit changes
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          git config --local user.name "GitHub Action"
          git config --local user.email "action@github.com"
          git add CITATION.cff
          git commit -m "Update citation info for $TAG_NAME" || exit 0
          git push
